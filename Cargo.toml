[package]
name = "cjseq"
version = "0.5.0"
description = "Create+process+modify+convert CityJSONSeq"
authors = ["Hugo Ledoux <h.ledoux@tudelft.nl>"]
edition = "2021"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/cityjson/cjseq"
repository = "https://github.com/cityjson/cjseq"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cjseq"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }

# CLI dependencies
clap = { version = "4.5.4", features = ["derive"], optional = true }
rand = { version = "0.8.5", optional = true }

# WASM dependencies
wasm-bindgen = { version = "0.2", features = ["serde-serialize"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dependencies.web-sys]
version = "0.3"
features = ["console"]
optional = true

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[features]
default = ["cli"]
#-- the `cjseq` binary; the library itself needs none of these
cli = ["dep:clap", "dep:rand", "dep:getrandom"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:web-sys", "dep:console_error_panic_hook"]

[[test]]
name = "cli"
required-features = ["cli"]
